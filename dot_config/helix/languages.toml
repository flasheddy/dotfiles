# ============================================================================
# 1. Ingress & Extraction Stack (Python)
# ============================================================================

# --- Python (extraction pipelines) ---
[[language]]
name = "python"
auto-format = true
roots = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", ".git"]
language-servers = ["basedpyright", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }

[language.debugger]
name = "debugpy"
transport = "tcp"
command = "python3"
args = ["-m", "debugpy.adapter"]

[[language.debugger.templates]]
name = "source"
request = "launch"
completion = [
  { name = "entrypoint", completion = "filename", default = "main.py" },
]
args = { program = "{0}" }

# basedpyright: fast type checking + auto-imports
[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "recommended"
autoImportCompletions = true
disableOrganizeImports = true    # ruff owns import sorting

# ruff native server: lint diagnostics + organize imports
[language-server.ruff]
command = "ruff"
args = ["server"]


# ============================================================================
# 2. Systems Programming (Rust / Go / C)
# ============================================================================

# --- Rust (systems katas) ---
# no [[language]] override needed — rust-analyzer formats over LSP
# rust-analyzer: clippy on save, all features, lifetime/reborrow/closure inlay hints
[language-server.rust-analyzer.config]
check = { command = "clippy" }
cargo = { allFeatures = true }
inlayHints = { lifetimeElisionHints = { enable = "skip_trivial" }, reborrowHints = { enable = "always" }, closureReturnTypeHints = { enable = "always" } }

# --- Go ---
[[language]]
name = "go"
language-servers = ["gopls", "golangci-lint-lsp"]

[language-server.gopls.config]
# Helpful Go-specific features
hints = { assignVariableTypes = true, compositeLiteralFields = true, constantValues = true, functionTypeParameters = true, parameterNames = true, rangeVariableTypes = true }

[language-server.golangci-lint-lsp]
command = "golangci-lint-langserver"

# --- C ---
[[language]]
name = "c"
auto-format = true
formatter = { command = "clang-format", args = [
  "--style=file",
  "--fallback-style=LLVM",
] }

# GDB's built-in DAP server (gdb >= 14).
[language.debugger]
name = "gdb"
transport = "stdio"
command = "gdb"
args = ["--interpreter=dap", "-q"]

# gdb's DAP `launch` takes the binary as `program`.
[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [{ name = "binary", completion = "filename" }]
args = { program = "{0}" }


# ============================================================================
# 3. Shell & Automation (Fish / Bash)
# ============================================================================

# --- Fish (daily shell / dotfiles) ---
[[language]]
name = "fish"
auto-format = true
language-servers = ["fish-lsp"]
formatter = { command = "fish_indent" }

[language-server.fish-lsp]
command = "fish-lsp"
args = ["start"]

# --- Bash (ops / chezmoi hooks) ---
[[language]]
name = "bash"
auto-format = true
language-servers = ["bash-language-server"]
formatter = { command = "shfmt", args = ["-i", "2", "-ci"] }


# ============================================================================
# 4. Frontend, APIs & Data Feeds
# ============================================================================

# --- TypeScript (Node/bun services) ---
[[language]]
name = "typescript"
auto-format = true
roots = ["package.json", "tsconfig.json", ".git"]
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

# --- JavaScript (scripts / SDKs) ---
[[language]]
name = "javascript"
auto-format = true
roots = ["package.json", "jsconfig.json", ".git"]
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--parser", "babel"] }

# tsserver inlay hints (applies to both TS and JS buffers)
[language-server.typescript-language-server.config]
typescript.inlayHints.parameterNames.enabled = "all"
typescript.inlayHints.variableTypes.enabled = true
typescript.inlayHints.functionLikeReturnTypes.enabled = true
javascript.inlayHints.parameterNames.enabled = "all"
javascript.inlayHints.variableTypes.enabled = true

# --- Markdown (docs / notes) ---
[[language]]
name = "markdown"
auto-format = true
roots = [".git", "mkdocs.yml", ".obsidian"]
language-servers = ["markdown-oxide", "typos-lsp"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }

[language-server.typos-lsp]
command = "typos-lsp"

# --- HTML ---
[[language]]
name = "html"
auto-format = true
language-servers = ["vscode-html-language-server"]
formatter = { command = "prettier", args = ["--parser", "html"] }

# --- TOML (configs) ---
[[language]]
name = "toml"
auto-format = true
language-servers = ["taplo"]
formatter = { command = "taplo", args = ["format", "-"] }

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

# --- JSON / JSONC (configs, tsconfig, package manifests) ---
[[language]]
name = "json"
auto-format = true
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "jsonc"
auto-format = true
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "jsonc"] }

# --- YAML (CI pipelines / Compose) ---
[[language]]
name = "yaml"
auto-format = true
language-servers = ["yaml-language-server"]
formatter = { command = "prettier", args = ["--parser", "yaml"] }

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]
