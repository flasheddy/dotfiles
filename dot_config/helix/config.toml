theme = "catppuccin_mocha"


[editor]
bufferline = "multiple" # Shows open files when more than one
color-modes = true
completion-trigger-len = 1 # Completion pops after first typed char
end-of-line-diagnostics = "hint" # Inline first diagnostic at end of line
idle-timeout = 50
popup-border = "all" # Bordered hover/signature-help popups
rulers = [81]
true-color = true
gutters = [
  "diff",
  "diagnostics",
  "line-numbers",
  "spacer",
] # The "Pure Minimalism" UI

[editor.statusline]
left = [
  "mode",
  "spacer",
  "spinner",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
right = [
  "diagnostics",
  "workspace-diagnostics",
  "selections",
  "register",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type",
  "version-control",
]

[editor.lsp]
display-inlay-hints = true # Display inlay hints

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false # Show dotfiles in `~/.config`; .gitignore still respected

[editor.auto-save]
focus-lost = true

[editor.indent-guides]
render = true
character = "╎"

[editor.soft-wrap]
enable = true
wrap-at-text-width = true


# --- Keymaps: navigation & buffers ---
[keys.normal]
C-s = ":w"
C-t = ":toggle soft-wrap.enable"

C-d = [
  "page_cursor_half_down",
  "align_view_center",
] # Centered cursor half-page down
C-u = [
  "page_cursor_half_up",
  "align_view_center",
] # Centered cursor half-page up

"]" = { b = "goto_next_buffer" }     # Buffer cycling: ]b / [b
"[" = { b = "goto_previous_buffer" }

[keys.normal.space]
x = ":buffer-close" # Space-x closes current buffer
