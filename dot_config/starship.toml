"$schema" = 'https://starship.rs/config-schema.json'

# Two-line layout: contextual info on top, cursor & vim mode below
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$cmd_duration\
$time\
$line_break\
$character"""

palette = 'catppuccin_mocha'

# Timeout for git status commands (keeps prompt snappy in large repos)
scan_timeout = 30

[os]
disabled = true
style = "bold red"
format = "[$symbol]($style) "

[os.symbols]
CachyOS = "󰣇"

[username]
show_always = false
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style) in "

[directory]
style = "bold peach"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "bold yellow"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold maroon"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "≢$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇡$ahead_count⇣$behind_count "
untracked = "?$count "
stashed = "$$count "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "

[rust]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold sapphire"
format = "via [$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version})]($style) "

[c]
symbol = " "
style = "bold blue"
format = "via [$symbol($version)]($style) "

[php]
symbol = " "
style = "bold lavender"
format = "via [$symbol($version)]($style) "

[java]
symbol = " "
style = "bold red"
format = "via [$symbol($version)]($style) "

[kotlin]
symbol = " "
style = "bold maroon"
format = "via [$symbol($version)]($style) "

[haskell]
symbol = " "
style = "bold teal"
format = "via [$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol($context)]($style) "

[conda]
symbol = " "
style = "bold green"
format = "via [$symbol$environment]($style) "
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "subtext0"
format = "at [ $time]($style) "

[cmd_duration]
min_time = 2_000
show_milliseconds = true
style = "bold lavender"
format = "took [ $duration]($style) "
show_notifications = true
min_time_to_notify = 45000

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold lavender)"
vimcmd_replace_symbol = "[❮](bold lavender)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
