# GREEN fixture for `just check-permissions` (accept mode): byte-equivalent to the
# real dot_config/goose/private_permission.yaml so the accepted posture is pinned.
user:
  always_allow:
  - tree
  - analyze
  - load
  - load_skill
  - delegate
  - todo__todo_write
  - extensionmanager__list_resources
  - extensionmanager__read_resource
  - extensionmanager__search_available_extensions
  ask_before:
  - shell
  - write
  - edit
  - read_image
  never_allow:
  - extensionmanager__manage_extensions
  - apps__create_app
  - apps__delete_app
  - orchestrator__send_message
  - orchestrator__start_agent
