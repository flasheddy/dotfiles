# Canonical pre-approval posture for goose tool permissions.
#
# Local execution is pre-approved (operator decision 2026-10-02): `shell`, `edit`,
# `write`, `read_image` sit in `always_allow` so routine local work does not
# interrupt for approval. Extension management stays gated (`ask_before`) because
# it changes the session's own capability surface, and the apps/orchestrator
# session surface stays blocked (`never_allow`).
#
# goose 1.52 rewrites permission.yaml itself and, in smart-approve mode, emits the
# scope key named after the active mode; historic files use `user`. The schema is
# undocumented in the 1.52 docs, so BOTH scopes carry the identical partition:
# whichever scope the runtime consults enforces the same posture.
smart_approve:
  always_allow:
  - analyze
  - delegate
  - edit
  - extensionmanager__list_resources
  - extensionmanager__read_resource
  - extensionmanager__search_available_extensions
  - load
  - load_skill
  - read_image
  - shell
  - todo__todo_write
  - tree
  - write
  ask_before:
  - extensionmanager__manage_extensions
  never_allow:
  - apps__create_app
  - apps__delete_app
  - orchestrator__send_message
  - orchestrator__start_agent
user:
  always_allow:
  - analyze
  - delegate
  - edit
  - extensionmanager__list_resources
  - extensionmanager__read_resource
  - extensionmanager__search_available_extensions
  - load
  - load_skill
  - read_image
  - shell
  - todo__todo_write
  - tree
  - write
  ask_before:
  - extensionmanager__manage_extensions
  never_allow:
  - apps__create_app
  - apps__delete_app
  - orchestrator__send_message
  - orchestrator__start_agent
